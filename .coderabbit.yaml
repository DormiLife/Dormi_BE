# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ko-KR"
reviews:
  profile: "chill"
  high_level_summary: true
  poll_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
      - develop
  path_filters:
    - "!**/build/**"
    - "!**/.gradle/**"
    - "!**/*.md"
chat:
  auto_reply: true
